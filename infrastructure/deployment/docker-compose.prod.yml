name: elyra-prod

services:
    api:
        build:
            context: ../..
            dockerfile: server/Dockerfile
        restart: unless-stopped
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER:-elyra}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-elyra}
            ELYRA_JWT_SECRET: ${ELYRA_JWT_SECRET:?ELYRA_JWT_SECRET must be set}
            ELYRA_ACCESS_TOKEN_TTL_HOURS: ${ELYRA_ACCESS_TOKEN_TTL_HOURS:-24}
            ELYRA_SERVER_ADDR: 0.0.0.0:8787
            RUST_LOG: ${RUST_LOG:-elyra_server=info,tower_http=info}
            ELYRA_SMTP_HOST: ${ELYRA_SMTP_HOST:-}
            ELYRA_SMTP_PORT: ${ELYRA_SMTP_PORT:-587}
            ELYRA_SMTP_SECURITY: ${ELYRA_SMTP_SECURITY:-starttls}
            ELYRA_SMTP_USERNAME: ${ELYRA_SMTP_USERNAME:-}
            ELYRA_SMTP_PASSWORD: ${ELYRA_SMTP_PASSWORD:-}
            ELYRA_SMTP_FROM: ${ELYRA_SMTP_FROM:-}
            ELYRA_SMTP_FROM_NAME: ${ELYRA_SMTP_FROM_NAME:-Elyra}
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "sh", "-c", "wget -q -O - http://127.0.0.1:8787/health | grep -q '\"status\":\"ok\"'"]
            interval: 10s
            timeout: 5s
            retries: 12
        networks: [elyra]

    web:
        build:
            context: ../..
            dockerfile: web/Dockerfile
        restart: unless-stopped
        ports:
            - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
        depends_on:
            api:
                condition: service_healthy
        networks: [elyra]

    caddy:
        image: caddy:2-alpine
        profiles: [tls]
        restart: unless-stopped
        environment:
            ELYRA_DOMAIN: ${ELYRA_DOMAIN:?ELYRA_DOMAIN must be set when the tls profile is enabled}
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - elyra-prod-caddy-data:/data
            - elyra-prod-caddy-config:/config
        depends_on:
            web:
                condition: service_started
        networks: [elyra]

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-elyra}
            POSTGRES_USER: ${POSTGRES_USER:-elyra}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
        volumes:
            - elyra-prod-postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 12
        networks: [elyra]

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
        volumes:
            - elyra-prod-redis:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
            interval: 10s
            timeout: 5s
            retries: 12
        networks: [elyra]

volumes:
    elyra-prod-postgres:
    elyra-prod-redis:
    elyra-prod-caddy-data:
    elyra-prod-caddy-config:

networks:
    elyra:
        driver: bridge
