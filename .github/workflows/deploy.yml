name: Deploy server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "packages/**"
      - "infrastructure/deployment/**"
      - "infrastructure/web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    # Deployments are opt-in: set the repository variable
    # ELYRA_DEPLOY_ENABLED=true and configure the ELYRA_DEPLOY_* secrets.
    if: ${{ vars.ELYRA_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ELYRA_DEPLOY_HOST }}
          username: ${{ secrets.ELYRA_DEPLOY_USER }}
          key: ${{ secrets.ELYRA_DEPLOY_KEY }}
          port: ${{ secrets.ELYRA_DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.ELYRA_DEPLOY_PATH }}"
            git fetch --prune origin main
            git reset --hard origin/main
            ./infrastructure/deployment/deploy.sh --backup
