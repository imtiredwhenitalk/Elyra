name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop -> target

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          "version=$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop bundles
        working-directory: apps/desktop
        env:
          # Optional: bake the production API base into release installers.
          # Set the repository variable ELYRA_DEFAULT_API_URL to e.g.
          # https://mail.example.com/api before tagging a release.
          ELYRA_DEFAULT_API_URL: ${{ vars.ELYRA_DEFAULT_API_URL }}
        run: npm run build

      - name: Build launcher
        run: cargo build --release -p elyra-launcher

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $candidates = Get-ChildItem -Path $PWD -Recurse -File -Filter "*.msi" |
            Where-Object { $_.FullName -notmatch "node_modules" } |
            Sort-Object LastWriteTime -Descending
          if (-not $candidates) { throw "The desktop build did not produce an MSI." }
          $msi = $candidates | Select-Object -First 1
          Copy-Item $msi.FullName (Join-Path $dist "Elyra-latest-x64.msi")
          Write-Host "MSI: $($msi.FullName)"

          $setup = Get-ChildItem -Path $PWD -Recurse -File -Filter "*-setup.exe" |
            Where-Object { $_.FullName -notmatch "node_modules" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName (Join-Path $dist "Elyra-latest-x64-setup.exe")
            Write-Host "NSIS: $($setup.FullName)"
          } else {
            Write-Warning "No NSIS installer was produced; the MSI is still published."
          }

          $launcher = Get-ChildItem -Path $PWD -Recurse -File -Filter "elyra-launcher.exe" |
            Where-Object { $_.FullName -notmatch "node_modules" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $launcher) { throw "The launcher build did not produce elyra-launcher.exe." }
          Copy-Item $launcher.FullName (Join-Path $dist "Elyra-Launcher-x64.exe")
          Write-Host "Launcher: $($launcher.FullName)"

          $hash = (Get-FileHash (Join-Path $dist "Elyra-latest-x64.msi") -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Elyra-latest-x64.msi" | Set-Content -Encoding ascii (Join-Path $dist "Elyra-latest-x64.msi.sha256")

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Sign updater artifacts and write latest.json
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $version = "${{ steps.version.outputs.version }}"

          # Accept both real newlines and escaped "\n" sequences in the GitHub secret.
          $env:TAURI_SIGNING_PRIVATE_KEY = ($env:TAURI_SIGNING_PRIVATE_KEY -replace '\\r\\n', "`n" -replace '\\n', "`n")
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }

          $assets = @(
            @{ File = (Join-Path $dist "Elyra-latest-x64.msi"); Platform = "windows-x86_64-msi" },
            @{ File = (Join-Path $dist "Elyra-latest-x64-setup.exe"); Platform = "windows-x86_64-nsis" }
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset.File)) { throw "Missing installer: $($asset.File)" }
            npm.cmd run tauri -- signer sign --app-version $version $asset.File
            $signaturePath = "$($asset.File).sig"
            if (-not (Test-Path $signaturePath)) { throw "Signer did not create $signaturePath" }
          }

          $nsisHash = (Get-FileHash (Join-Path $dist "Elyra-latest-x64-setup.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          "$nsisHash  Elyra-latest-x64-setup.exe" | Set-Content -Encoding ascii (Join-Path $dist "Elyra-latest-x64-setup.exe.sha256")

          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v$version" }
          $assetBase = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $msiSignature = (Get-Content (Join-Path $dist "Elyra-latest-x64.msi.sig") -Raw).Trim()
          $nsisSignature = (Get-Content (Join-Path $dist "Elyra-latest-x64-setup.exe.sig") -Raw).Trim()
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          $manifest = [ordered]@{
            version = $version
            notes = "Elyra $version is available. See the GitHub release page for the full changelog."
            pub_date = $publishedAt
            platforms = [ordered]@{
              "windows-x86_64-msi" = [ordered]@{
                url = "$assetBase/Elyra-latest-x64.msi"
                signature = $msiSignature
              }
              "windows-x86_64-nsis" = [ordered]@{
                url = "$assetBase/Elyra-latest-x64-setup.exe"
                signature = $nsisSignature
              }
              "windows-x86_64" = [ordered]@{
                url = "$assetBase/Elyra-latest-x64.msi"
                signature = $msiSignature
              }
            }
          }

          $manifestJson = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText(
            (Join-Path $dist "latest.json"),
            $manifestJson,
            (New-Object System.Text.UTF8Encoding $false)
          )
          Write-Host "Wrote signed update manifest for $version"

      - name: Warn when release is unsigned
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        shell: pwsh
        run: |
          Write-Warning "TAURI_SIGNING_PRIVATE_KEY is not configured; publishing without latest.json. In-app updates will work after the first signed release is published."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Elyra ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Elyra-*
