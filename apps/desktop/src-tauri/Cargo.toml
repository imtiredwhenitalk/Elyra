[package]
name = "tauri-app"
version = "0.5.0"
description = "Elyra — a private, local-first email workspace."
authors = ["Elyra"]
edition = "2021"
license.workspace = true

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.8", features = [] }

[dependencies]
tauri = { version = "2.13", features = [] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
imap = "3.0.0-alpha.15"
mail-parser = "1.0"
regex = "1"
url = "2"
ed25519-dalek = { version = "3", features = ["rand_core"] }
elyra-crypto = { path = "../../../packages/crypto" }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
